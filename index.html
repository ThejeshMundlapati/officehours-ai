<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="chalk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>OfficeHours AI</title>
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1714" media="(prefers-color-scheme: dark)" />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html[data-theme="chalk"] { background-color: #f7f4ec; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        html[data-theme="chalk"] { background-color: #0f1714; color-scheme: dark; }
      }
    </style>
    <script>
      // SDK-rendered UI (e.g. the sign-in overlay) reads data-ui-theme to pick
      // its light/dark token set; keep it in step with the OS colour scheme.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          document.documentElement.setAttribute('data-ui-theme', mq.matches ? 'dark' : 'light')
        }
        apply()
        if (mq.addEventListener) mq.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
